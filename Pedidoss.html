<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>📋 Mis Pedidos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e2e8f0;font-family:sans-serif;min-height:100vh;padding-bottom:80px}
input,textarea,select,button{font-family:inherit;outline:none}
.inp{width:100%;padding:12px;background:#1a1f2e;border:1px solid #2d3448;border-radius:8px;color:#fff;margin-bottom:10px;display:block}
#header{background:#1a1f2e;border-bottom:2px solid #f59e0b;padding:15px;position:sticky;top:0;z-index:100}
#header-inner{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
#wrap{max-width:600px;margin:0 auto;padding:10px}
.btn-new{width:100%;padding:15px;background:#f59e0b;color:#000;border:none;border-radius:10px;font-size:15px;font-weight:900;text-transform:uppercase;margin-top:10px;cursor:pointer}
.form-box{background:#1a1f2e;padding:15px;border-radius:12px;margin-top:15px;border:1px solid #2d3448}
.client-card{background:#141824;border:1px solid #252d40;border-radius:12px;margin-bottom:12px;overflow:hidden}
.client-head{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#1a1f2e;cursor:pointer}
.pedidos-list{padding:10px}
.pedido-card{background:#1a1f2e;border:1px solid #252d40;border-radius:8px;padding:10px;margin-bottom:8px}
.abonos-section{background:#0f1117;padding:12px;border-top:1px solid #252d40}
.bar-bg{height:6px;background:#252d40;border-radius:3px;margin:10px 0;overflow:hidden}
.bar-fill{height:100%;background:#f59e0b}
.btn-acc{padding:8px 12px;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer}
.btn-del{background:#2d1515;color:#f87171;border:1.5px solid #ef4444;width:100%;margin-top:10px;padding:10px;border-radius:6px;font-weight:bold}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-content{background:#1a1f2e;padding:20px;border-radius:15px;width:100%;max-width:350px}
.fecha-txt{font-size:9px;color:#64748b;display:block;margin-bottom:2px}
/* Estilo para sugerencias */
.sug-contenedor{position:relative}
.sug-lista{position:absolute;top:100%;left:0;right:0;background:#2d3448;border-radius:0 0 8px 8px;z-index:50;max-height:150px;overflow-y:auto;border:1px solid #f59e0b;border-top:none;display:none}
.sug-item{padding:10px;color:#fff;border-bottom:1px solid #1a1f2e;font-size:13px}
.sug-item:active{background:#f59e0b;color:#000}
</style>
</head>
<body>

<div id="header">
  <div id="header-inner">
    <div>
      <div id="h-agencia" style="font-size:10px;color:#f59e0b">AGENCIA</div>
      <div id="h-app" style="font-size:18px;font-weight:900">📋 MIS PEDIDOS</div>
    </div>
    <div style="text-align:right">
      <div id="total-gral" style="font-size:18px;font-weight:900;color:#f59e0b">$0.00</div>
      <button onclick="verAjustes()" style="background:none;border:none;font-size:20px">⚙️</button>
    </div>
  </div>
</div>

<div id="wrap">
  <div id="box-ajustes" style="display:none" class="form-box">
    <input class="inp" id="cfg-a" placeholder="Nombre Agencia"/>
    <input class="inp" id="cfg-t" placeholder="Título App"/>
    <button onclick="guardarCfg()" class="btn-new" style="background:#10b981;color:#fff">Guardar Ajustes</button>
  </div>

  <button class="btn-new" id="btn-main" onclick="verForm()">+ Nuevo Pedido</button>

  <div id="box-form" style="display:none" class="form-box">
    <h4 id="form-tit" style="margin-bottom:10px;color:#f59e0b">NUEVO PEDIDO</h4>
    <div class="sug-contenedor">
      <input class="inp" id="f-cli" placeholder="Cliente *" oninput="mostrarSugerencias()" autocomplete="off"/>
      <div id="sug-lista" class="sug-lista"></div>
    </div>
    <textarea class="inp" id="f-des" placeholder="Descripción *"></textarea>
    <input class="inp" id="f-pre" type="number" placeholder="Precio $"/>
    <select class="inp" id="f-est">
      <option value="Pendiente">⏳ Pendiente</option>
      <option value="En Proceso">🔧 En proceso</option>
      <option value="Completado">✅ Completado</option>
    </select>
    <button onclick="guardarPedido()" class="btn-new">Guardar Pedido</button>
    <button onclick="cerrarForm()" style="width:100%;background:none;border:none;color:#64748b;margin-top:10px">Cancelar</button>
  </div>

  <input class="inp" id="busqueda" placeholder="🔍 Buscar cliente..." oninput="dibujar()" style="margin-top:15px"/>
  <div id="lista-clientes"></div>
</div>

<div id="modal-abo" class="modal">
  <div class="modal-content">
    <h3 id="abo-nom" style="margin-bottom:15px">Abonar</h3>
    <input class="inp" id="abo-mon" type="number" placeholder="Monto $"/>
    <input class="inp" id="abo-des" placeholder="Descripción (Ej: Efectivo)"/>
    <button onclick="guardarAbono()" class="btn-new" style="background:#10b981;color:#fff">Registrar</button>
    <button onclick="cerrarModal()" style="width:100%;background:none;border:none;color:#64748b;margin-top:10px">Cerrar</button>
  </div>
</div>

<script>
let pedidos = JSON.parse(localStorage.getItem("db_v13") || "[]");
let abonos = JSON.parse(localStorage.getItem("db_a_v13") || "[]");
let cfg = JSON.parse(localStorage.getItem("db_c_v13") || '{"a":"Agencia","t":"Mis Pedidos"}');
let editId = null, clienteAbono = null, colapsados = {};

const moneda = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0);
const f_hoy = () => new Date().toLocaleDateString();

function verAjustes() { 
    const b = document.getElementById("box-ajustes");
    b.style.display = b.style.display === "none" ? "block" : "none";
}

function guardarCfg() {
    cfg.a = document.getElementById("cfg-a").value;
    cfg.t = document.getElementById("cfg-t").value;
    localStorage.setItem("db_c_v13", JSON.stringify(cfg));
    dibujar(); verAjustes();
}

function verForm(id = null) {
    editId = id;
    if(id) {
        const p = pedidos.find(x => x.id === id);
        document.getElementById("f-cli").value = p.cliente;
        document.getElementById("f-des").value = p.descripcion;
        document.getElementById("f-pre").value = p.precio;
        document.getElementById("f-est").value = p.estado;
        document.getElementById("form-tit").textContent = "✏️ EDITAR PEDIDO";
    } else {
        document.getElementById("f-cli").value = "";
        document.getElementById("f-des").value = "";
        document.getElementById("f-pre").value = "";
        document.getElementById("form-tit").textContent = "NUEVO PEDIDO";
    }
    document.getElementById("box-form").style.display = "block";
    document.getElementById("btn-main").style.display = "none";
}

function cerrarForm() {
    document.getElementById("box-form").style.display = "none";
    document.getElementById("btn-main").style.display = "block";
    editId = null;
}

// FUNCION DE SUGERENCIAS
function mostrarSugerencias() {
    const txt = document.getElementById("f-cli").value.toLowerCase();
    const lista = document.getElementById("sug-lista");
    if(!txt) { lista.style.display = "none"; return; }
    
    const clientesUnicos = [...new Set(pedidos.map(p => p.cliente))];
    const filtrados = clientesUnicos.filter(c => c.toLowerCase().includes(txt));
    
    if(filtrados.length > 0) {
        lista.innerHTML = filtrados.map(c => `<div class="sug-item" onclick="seleccionarSug('${c}')">${c}</div>`).join("");
        lista.style.display = "block";
    } else {
        lista.style.display = "none";
    }
}

function seleccionarSug(c) {
    document.getElementById("f-cli").value = c;
    document.getElementById("sug-lista").style.display = "none";
}

function guardarPedido() {
    const c = document.getElementById("f-cli").value.trim();
    const d = document.getElementById("f-des").value.trim();
    const p = parseFloat(document.getElementById("f-pre").value) || 0;
    const e = document.getElementById("f-est").value;
    if(!c || !d) return;

    if(editId) {
        pedidos = pedidos.map(x => x.id === editId ? {...x, cliente:c, descripcion:d, precio:p, estado:e} : x);
    } else {
        pedidos.unshift({id: Date.now(), cliente:c, descripcion:d, precio:p, estado:e, fecha: f_hoy()});
    }
    
    localStorage.setItem("db_v13", JSON.stringify(pedidos));
    cerrarForm(); dibujar();
}

function abrirAbono(c) {
    clienteAbono = c;
    document.getElementById("abo-nom").textContent = c;
    document.getElementById("modal-abo").style.display = "flex";
}

function cerrarModal() { document.getElementById("modal-abo").style.display = "none"; }

function guardarAbono() {
    const m = parseFloat(document.getElementById("abo-mon").value) || 0;
    const d = document.getElementById("abo-des").value.trim() || "Abono";
    if(m <= 0) return;
    abonos.push({cliente: clienteAbono, monto: m, descripcion: d, fecha: f_hoy(), id: Date.now()});
    localStorage.setItem("db_a_v13", JSON.stringify(abonos));
    cerrarModal(); dibujar();
}

function borrarCuenta(c) {
    if(confirm("¿Deseas eliminar definitivamente todos los datos de " + c + "? El sistema quedará en cero para este cliente.")) {
        pedidos = pedidos.filter(x => x.cliente !== c);
        abonos = abonos.filter(x => x.cliente !== c);
        localStorage.setItem("db_v13", JSON.stringify(pedidos));
        localStorage.setItem("db_a_v13", JSON.stringify(abonos));
        dibujar();
    }
}

function generarPDF(c) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;
    doc.setFontSize(16); doc.text(cfg.a.toUpperCase(), 10, y);
    y += 10; doc.setFontSize(12); doc.text("CLIENTE: " + c, 10, y);
    y += 10; doc.setFontSize(10); doc.text("ESTADO DE CUENTA AL: " + f_hoy(), 10, y);
    y += 5; doc.line(10, y, 200, y);
    y += 10; doc.setFont(undefined, 'bold'); doc.text("SERVICIOS", 10, y);
    doc.setFont(undefined, 'normal');
    pedidos.filter(p => p.cliente === c).forEach(p => {
        y += 8; if(y > 280) { doc.addPage(); y = 20; }
        doc.text(`${p.fecha} - ${p.descripcion.substring(0,40)}`, 10, y);
        doc.text(moneda(p.precio), 170, y);
    });
    y += 10; doc.setFont(undefined, 'bold'); doc.text("ABONOS", 10, y);
    doc.setFont(undefined, 'normal');
    abonos.filter(a => a.cliente === c).forEach(a => {
        y += 8; if(y > 280) { doc.addPage(); y = 20; }
        doc.text(`${a.fecha} - ${a.descripcion}`, 10, y);
        doc.text("- " + moneda(a.monto), 170, y);
    });
    y += 15; doc.line(10, y, 200, y);
    const pen = totalC(c) - abonadoC(c);
    y += 10; doc.setFontSize(12); doc.setFont(undefined, 'bold');
    doc.text("SALDO PENDIENTE:", 10, y);
    doc.text(moneda(pen), 170, y);
    doc.save(`Cuenta_${c}.pdf`);
}

function totalC(c) { return pedidos.filter(p => p.cliente === c).reduce((s,p) => s+p.precio, 0); }
function abonadoC(c) { return abonos.filter(a => a.cliente === c).reduce((s,a) => s+a.monto, 0); }

function dibujar() {
    const q = document.getElementById("busqueda").value.toLowerCase();
    const grupos = {};
    pedidos.forEach(p => {
        if(p.cliente.toLowerCase().includes(q) || p.descripcion.toLowerCase().includes(q)) {
            if(!grupos[p.cliente]) grupos[p.cliente] = [];
            grupos[p.cliente].push(p);
        }
    });
    const contenedor = document.getElementById("lista-clientes");
    contenedor.innerHTML = Object.entries(grupos).map(([cliente, items]) => {
        const t = totalC(cliente), a = abonadoC(cliente), pen = t - a;
        const pct = t > 0 ? Math.min(100, Math.round((a/t)*100)) : 0;
        const listo = pen <= 0 && t > 0;
        return `
        <div class="client-card">
          <div class="client-head" onclick="alternar('${cliente.replace(/'/g,"")}')">
            <b>${cliente}</b>
            <span style="color:${listo ? '#10b981' : '#f87171'}">${listo ? 'PAGADO' : moneda(pen)}</span>
          </div>
          <div id="capa-${cliente}" style="display:${colapsados[cliente] ? 'none' : 'block'}">
            <div class="pedidos-list">
              ${items.map(i => `
                <div class="pedido-card">
                  <span class="fecha-txt">${i.fecha || 'S/F'}</span>
                  <div style="font-size:12px;margin-bottom:5px">${i.descripcion}</div>
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:10px;background:#2d3448;padding:2px 6px;border-radius:4px">${i.estado}</span>
                    <b>${moneda(i.precio)}</b>
                  </div>
                  <button onclick="verForm(${i.id})" style="background:none;border:none;color:#93c5fd;font-size:11px;margin-top:8px;text-decoration:underline">✏️ Editar</button>
                </div>
              `).join("")}
            </div>
            <div class="abonos-section">
              <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${listo?'#10b981':''}"></div></div>
              <div style="display:flex;gap:10px">
                <button class="btn-acc" style="flex:1;background:#0d2818;color:#4ade80" onclick="abrirAbono('${cliente.replace(/'/g,"")}')">💰 ABONAR</button>
                <button class="btn-acc" style="flex:1;background:#1e293b;color:#fff" onclick="generarPDF('${cliente.replace(/'/g,"")}')">📄 PDF</button>
              </div>
              ${listo ? `<button class="btn-del" onclick="borrarCuenta('${cliente.replace(/'/g,"")}')">🗑️ BORRAR CUENTA</button>` : ''}
            </div>
          </div>
        </div>`;
    }).join("");
    document.getElementById("h-agencia").textContent = cfg.a;
    document.getElementById("h-app").textContent = cfg.t;
    const totalG = [...new Set(pedidos.map(p=>p.cliente))].reduce((s,c)=> s + (totalC(c)-abonadoC(c)), 0);
    document.getElementById("total-gral").textContent = moneda(totalG);
}
function alternar(c) { colapsados[c] = !colapsados[c]; dibujar(); }
dibujar();
</script>
</body>
</html>
